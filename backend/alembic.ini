# Alembic configuration for developers (`cd backend && alembic ...`).
#
# At runtime the app never shells out to this file: `app.database.init_db()`
# calls Alembic programmatically (see app/migrations/runner.py). The database
# URL comes from the app's own config (`DATA_DIR/horde.db`); point it at a
# scratch database with `DATA_DIR=$(mktemp -d) alembic upgrade head`.

[alembic]
script_location = %(here)s/app/migrations
file_template = %%(rev)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
