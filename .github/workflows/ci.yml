name: CI

on:
  # Branches are tested through their pull request; a push trigger on every
  # branch ran the whole suite twice per PR commit.
  push:
    branches: [main]
    paths-ignore:
      - "docs/assets/github-clones.json"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep '^ruff' backend/requirements-dev.txt)"
      - name: Ruff check
        working-directory: backend
        run: ruff check .
      - name: Ruff format
        working-directory: backend
        run: ruff format --check .
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: API types are up to date
        working-directory: frontend
        run: npm run gen:api:check
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Prettier
        working-directory: frontend
        run: npm run format:check
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
      - name: requirements.lock matches requirements.txt
        run: python ../scripts/check_requirements_lock.py
      - name: Mypy
        run: mypy
      - name: OpenAPI export is up to date
        run: PYTHONPATH=. python -m app.export_openapi --check openapi.json
      - name: Run pytest
        run: PYTHONPATH=. pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # The suite runs on one worker against one server (every test resets its
  # state), so it is split across jobs instead: each shard starts its own
  # webServers and runs a quarter of the spec files.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements.lock
          pip install -r backend/requirements-dev.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report
          retention-days: 7

  # The ruleset on main requires a check named `e2e`; this rolls the shards up
  # into it. `always()` keeps it from being skipped (a skipped required check
  # counts as passing) when a shard fails.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All e2e shards passed
        run: test "${{ needs.e2e-shard.result }}" = success

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Build wiki
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          mkdocs build --strict
