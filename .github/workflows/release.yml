name: Release

# Pushing a tag like v1.2.3 publishes a multi-arch image to GHCR and creates a
# GitHub Release with generated notes. See docs/development/release-process.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jm-connell/horde

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Tag must point at a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main; release tags must be cut from main."
            exit 1
          fi

      - name: CI and Image workflows must be green on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag only commits that passed: wait for runs that are still going
          # (up to 40 minutes), fail if a workflow has no successful run.
          for wf in ci.yml image.yml; do
            for _ in $(seq 1 80); do
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?head_sha=${GITHUB_SHA}&per_page=50" --jq '.workflow_runs')"
              ok="$(jq '[.[] | select(.conclusion == "success")] | length' <<<"${runs}")"
              pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"${runs}")"
              if [ "${ok}" -gt 0 ]; then
                echo "${wf}: green on ${GITHUB_SHA}"
                break
              fi
              if [ "${pending}" -eq 0 ]; then
                echo "::error::${wf} has no successful run on ${GITHUB_SHA}. Fix main (or re-run the workflow) and re-tag."
                exit 1
              fi
              echo "${wf}: still running, waiting..."
              sleep 30
            done
            if [ "${ok}" -le 0 ]; then
              echo "::error::timed out waiting for ${wf}"
              exit 1
            fi
          done

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          flavor: |
            latest=false

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HORDE_VERSION=${{ steps.meta.outputs.version }}
            HORDE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--verify-tag --generate-notes --title "Horde ${GITHUB_REF_NAME#v}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          notes=$'Image: `ghcr.io/jm-connell/horde:'"${GITHUB_REF_NAME#v}"$'`\n\nSee CHANGELOG.md for upgrade notes.'
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" --notes "${notes}"
