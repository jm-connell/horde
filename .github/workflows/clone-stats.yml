name: Clone stats

# Clone counts are not public. Create a fine-grained PAT with Administration:
# read on this repo, save it as the TRAFFIC_TOKEN secret, then run this workflow.
#
# The archive lives on its own orphan branch, `stats`, and NEVER on main: a
# daily bot commit on main made every install report "update available" and
# forced pointless rebuilds. pages.yml reads the JSON from that branch at build
# time; docs/assets/github-clones.json on main is a frozen offline snapshot.

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: clone-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Load the previous archive
        run: |
          mkdir -p "$RUNNER_TEMP/stats"
          if git ls-remote --exit-code --heads origin stats >/dev/null 2>&1; then
            git fetch --depth=1 origin stats
            git show FETCH_HEAD:github-clones.json > "$RUNNER_TEMP/stats/github-clones.json"
          else
            echo "No stats branch yet; seeding from the committed snapshot."
            cp docs/assets/github-clones.json "$RUNNER_TEMP/stats/github-clones.json"
          fi
      - name: Update clone archive
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/update_github_clones.py --optional --out "$RUNNER_TEMP/stats/github-clones.json"
      - name: Commit to the stats branch
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin stats >/dev/null 2>&1; then
            git fetch --depth=1 origin stats
            git checkout -q -B stats FETCH_HEAD
          else
            git checkout -q --orphan stats
            git rm -rfq --cached .
            git clean -fdxq
          fi
          cp "$RUNNER_TEMP/stats/github-clones.json" github-clones.json
          git add github-clones.json
          if git diff --cached --quiet; then
            echo "No clone-stat changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Update GitHub clone stats"
          git push origin HEAD:refs/heads/stats
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the wiki with the new numbers
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
