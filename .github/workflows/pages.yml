name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  schedule:
    # Weekly safety net; clone-stats.yml also dispatches this after each stats update.
    - cron: "40 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Use the latest clone stats
        run: |
          # Written daily by clone-stats.yml to the orphan `stats` branch. Without
          # it, the snapshot committed on main is used.
          if git ls-remote --exit-code --heads origin stats >/dev/null 2>&1; then
            git fetch --depth=1 origin stats
            git show FETCH_HEAD:github-clones.json > docs/assets/github-clones.json
          else
            echo "No stats branch yet; using the committed snapshot."
          fi
      - name: Build wiki
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
